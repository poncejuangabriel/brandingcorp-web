<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title id="pageTitle">Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style id="dynamicStyles">/* cargado desde config */</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:Montserrat,system-ui,sans-serif;color:#fff;overflow-x:hidden;}
::selection{background:var(--accent);color:var(--btn-text);}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(0,0,0,0.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.nav-logo{display:flex;align-items:center;gap:14px;text-decoration:none;}
.nav-logo img{height:36px;width:36px;border-radius:50%;object-fit:cover;}
.nav-logo-text strong{display:block;font-size:15px;font-weight:900;letter-spacing:2px;color:#fff;}
.nav-logo-text span{display:block;font-size:10px;font-weight:600;letter-spacing:3px;color:var(--text-muted);}
.cart-btn{position:relative;display:flex;align-items:center;gap:10px;background:var(--btn-bg);color:var(--btn-text);border:none;cursor:pointer;font-family:Montserrat,sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;padding:11px 22px;border-radius:2px;transition:opacity .15s;}
.cart-btn:hover{opacity:.85;}
.cart-badge{position:absolute;top:-7px;right:-7px;background:var(--gold);color:#000;font-size:10px;font-weight:900;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none;}

/* HERO */
.hero{position:relative;padding:80px 32px 70px;overflow:hidden;border-bottom:1px solid var(--border);}
.hero-inner{position:relative;max-width:1200px;margin:0 auto;}
.hero-label{font-size:11px;font-weight:700;letter-spacing:4px;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
.hero-label::before{content:'';display:block;width:28px;height:1px;background:var(--gold);}
.hero h1{font-size:clamp(42px,7vw,96px);font-weight:900;line-height:.92;letter-spacing:-.02em;text-transform:uppercase;color:#fff;max-width:800px;}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero-sub{margin-top:24px;font-size:16px;font-weight:500;color:rgba(255,255,255,0.5);max-width:480px;line-height:1.6;}
.hero-meta{display:flex;gap:32px;margin-top:36px;flex-wrap:wrap;}
.hero-meta span{font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,0.35);}

/* FILTERS */
.filters{max-width:1200px;margin:0 auto;padding:32px 32px 0;display:flex;flex-wrap:wrap;gap:10px;}
.filter-btn{font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;padding:9px 18px;border:1px solid var(--border);border-radius:2px;background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s;}
.filter-btn:hover,.filter-btn.active{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg);}

/* PRODUCT GRID */
.products-grid{max-width:1200px;margin:32px auto 0;padding:0 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.product-card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,transform .18s;}
.product-card:hover{border-color:rgba(255,255,255,0.3);transform:translateY(-3px);}
.product-img{aspect-ratio:1/1;background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.product-img img{width:100%;height:100%;object-fit:cover;display:none;}
.product-img img.loaded{display:block;}
.ph-inner{display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,0.15);}
.ph-inner span.lbl{font-size:10px;letter-spacing:2px;font-weight:600;}
.product-img.has-photo{cursor:zoom-in;}
.product-img.has-photo img{transition:transform .3s;}
.product-card:hover .product-img.has-photo img{transform:scale(1.04);}
.photo-count{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.65);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;padding:4px 8px;border-radius:2px;pointer-events:none;}
.product-badge{position:absolute;top:12px;left:12px;background:var(--gold);color:#000;font-size:9px;font-weight:900;letter-spacing:2px;padding:4px 10px;border-radius:2px;}
.product-info{padding:20px;flex:1;display:flex;flex-direction:column;gap:10px;}
.product-name{font-size:15px;font-weight:800;color:#fff;line-height:1.2;}
.product-desc{font-size:12px;color:var(--text-muted);line-height:1.55;font-weight:500;}
.product-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:16px;}
.product-price{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;}
.product-price small{font-size:13px;font-weight:600;color:var(--text-muted);}
.add-btn{font-family:Montserrat,sans-serif;font-size:11px;font-weight:800;letter-spacing:1.5px;background:var(--btn-bg);color:var(--btn-text);border:none;cursor:pointer;padding:10px 16px;border-radius:2px;transition:all .15s;white-space:nowrap;}
.add-btn:hover{opacity:.8;}
.add-btn.added{background:var(--gold);color:#000;}
.size-selector{display:flex;gap:6px;flex-wrap:wrap;}
.size-opt{font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 10px;border:1px solid var(--border);border-radius:2px;cursor:pointer;color:var(--text-muted);background:transparent;font-family:Montserrat,sans-serif;transition:all .1s;}
.size-opt:hover,.size-opt.selected{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg);}

/* CART SIDEBAR */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;}
.cart-overlay.open{opacity:1;pointer-events:all;}
.cart-drawer{position:fixed;top:0;right:0;width:min(420px,100vw);height:100%;background:#111;border-left:1px solid var(--border);z-index:301;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.cart-drawer.open{transform:translateX(0);}
.cart-head{padding:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cart-head h2{font-size:14px;font-weight:900;letter-spacing:3px;}
.close-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:4px;}
.cart-items{flex:1;overflow-y:auto;padding:0;}
.cart-empty{padding:60px 24px;text-align:center;color:var(--text-muted);font-size:13px;font-weight:600;letter-spacing:1px;}
.cart-item{display:flex;gap:14px;padding:18px 24px;border-bottom:1px solid var(--border);align-items:center;}
.cart-item-emoji{font-size:32px;width:48px;text-align:center;flex-shrink:0;}
.cart-item-thumb{width:48px;height:48px;object-fit:cover;border-radius:2px;flex-shrink:0;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:56px 16px 24px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:min(90vw,900px);max-height:calc(100vh - 140px);object-fit:contain;border-radius:2px;user-select:none;-webkit-user-drag:none;}
.lb-title{font-size:12px;font-weight:800;letter-spacing:2px;color:#fff;text-transform:uppercase;text-align:center;}
.lb-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:34px;line-height:1;cursor:pointer;padding:4px 10px;}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.5);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.lb-arrow:hover{background:#fff;color:#000;}
.lb-prev{left:16px;}
.lb-next{right:16px;}
.lb-dots{display:flex;gap:8px;}
.lb-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);border:none;cursor:pointer;padding:0;}
.lb-dot.active{background:#fff;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-name{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-item-size{font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-top:2px;}
.cart-item-price{font-size:14px;font-weight:900;color:var(--gold);margin-top:4px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qty-btn{background:var(--border);border:none;color:#fff;width:28px;height:28px;border-radius:2px;cursor:pointer;font-size:16px;font-family:Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;transition:background .1s;}
.qty-btn:hover{background:var(--btn-bg);color:var(--btn-text);}
.qty-num{font-size:13px;font-weight:800;min-width:16px;text-align:center;}
.cart-foot{padding:24px;border-top:1px solid var(--border);}
.cart-total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;}
.cart-total-label{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--text-muted);}
.cart-total-amount{font-size:28px;font-weight:900;color:#fff;}
.checkout-btn{width:100%;background:var(--btn-bg);color:var(--btn-text);border:none;cursor:pointer;font-family:Montserrat,sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;padding:18px;border-radius:2px;transition:opacity .15s;}
.checkout-btn:hover{opacity:.85;}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed;}
.checkout-note{font-size:10px;color:var(--text-muted);letter-spacing:1px;text-align:center;margin-top:12px;}

/* FOOTER */
.store-footer{max-width:1200px;margin:80px auto 0;padding:32px 32px 48px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;}
.store-footer a{color:var(--text-muted);text-decoration:none;font-size:12px;font-weight:600;letter-spacing:1px;}
.store-footer a:hover{color:#fff;}
.powered{font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:2px;font-weight:600;}
.success-banner{display:none;background:var(--gold);color:#000;text-align:center;padding:14px;font-size:13px;font-weight:800;letter-spacing:1px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#fff;color:#000;font-size:12px;font-weight:800;letter-spacing:1.5px;padding:14px 24px;border-radius:4px;z-index:400;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .nav{padding:14px 20px;}
  .hero{padding:60px 20px 50px;}
  .filters{padding:24px 20px 0;}
  .products-grid{padding:0 20px;grid-template-columns:repeat(2,1fr);gap:10px;}
  .product-info{padding:14px;}
  .product-name{font-size:13px;}
  .product-price{font-size:18px;}
  .add-btn{font-size:10px;padding:8px 12px;}
  .cart-drawer{width:100vw;}
  .lb-arrow{width:40px;height:40px;font-size:18px;}
  .lb-prev{left:8px;}
  .lb-next{right:8px;}
}
</style>
</head>
<body>

<div class="success-banner" id="successBanner">
  ¡Pedido recibido! Recibirás la confirmación por email. Gracias por tu compra.
</div>

<header class="nav">
  <a id="navLogo" class="nav-logo" href="#" target="_blank">
    <img id="navLogoImg" src="" alt="">
    <div class="nav-logo-text">
      <strong id="navName"></strong>
      <span id="navTagline"></span>
    </div>
  </a>
  <button class="cart-btn" id="cartBtn" onclick="toggleCart()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    CARRITO
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
</header>

<!-- CART SIDEBAR -->
<div class="toast" id="toast"></div>
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h2>TU CARRITO</h2>
    <button class="close-btn" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty" id="cartEmpty">El carrito está vacío</div>
  </div>
  <div class="cart-foot" id="cartFoot" style="display:none;">
    <div class="cart-total-row">
      <span class="cart-total-label">TOTAL</span>
      <span class="cart-total-amount" id="cartTotal">0,00 €</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">FINALIZAR PEDIDO →</button>
    <div class="checkout-note">Pago seguro con Stripe</div>
  </div>
</div>

<section class="hero" id="heroSection">
  <div class="hero-inner">
    <div class="hero-label">TIENDA OFICIAL</div>
    <h1 id="heroTitle"></h1>
    <p class="hero-sub" id="heroDesc"></p>
    <div class="hero-meta" id="heroMeta"></div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()" aria-label="Cerrar">×</button>
  <button class="lb-arrow lb-prev" id="lbPrev" onclick="lbStep(-1)" aria-label="Foto anterior">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-arrow lb-next" id="lbNext" onclick="lbStep(1)" aria-label="Foto siguiente">›</button>
  <div class="lb-title" id="lbTitle"></div>
  <div class="lb-dots" id="lbDots"></div>
</div>

<div class="filters" id="filtersContainer"></div>
<div class="products-grid" id="productsGrid"></div>

<footer class="store-footer">
  <div id="footerLinks"></div>
  <span class="powered">POWERED BY BRANDINGCORP</span>
</footer>

<script>
const WORKER_URL = 'https://brandingcorp-checkout.poncejuangabriel.workers.dev';

// ── Estado del carrito ──────────────────────────────────────
let cart = [];   // [{id, name, price, size, emoji, qty}]
let gymId = '';

// ── Cargar página ───────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('pedido') === 'ok') {
    document.getElementById('successBanner').style.display = 'block';
    localStorage.removeItem('bc_cart_' + gymId);
  }

  const configPath = window.GYM_CONFIG_PATH || '../config.json';
  const resp = await fetch(configPath);
  const C = await resp.json();
  gymId = C.gym.id || 'gym';

  const saved = localStorage.getItem('bc_cart_' + gymId);
  if (saved) { try { cart = JSON.parse(saved); } catch(e) { cart = []; } }

  buildPage(C);

  // El carrito guardado puede tener precios antiguos: se actualizan con el catálogo actual
  cart = cart.flatMap(i => {
    const p = C.products.find(x => x.id === i.id);
    return p ? [{ ...i, name: p.name, price: p.price, emoji: p.emoji }] : [];
  });
  saveCart();
  renderCart();
}

function buildPage(C) {
  const g = C.gym;
  const b = C.brand;

  document.getElementById('dynamicStyles').textContent = `
    :root {
      --accent: ${b.accent};
      --accent-dim: ${b.accent_dim || b.accent};
      --gold: ${b.gold || b.accent};
      --bg: ${b.bg};
      --bg2: ${b.bg2};
      --bg3: ${b.bg3};
      --border: ${b.border};
      --text-muted: ${b.text_muted};
      --btn-bg: ${b.btn_bg};
      --btn-text: ${b.btn_text};
    }
  `;

  document.getElementById('pageTitle').textContent = g.name + ' Store';
  document.getElementById('navLogo').href = g.web;
  const logoImg = document.getElementById('navLogoImg');
  logoImg.src = g.logo_url;
  logoImg.alt = g.name;
  if (g.logo_filter) logoImg.style.filter = g.logo_filter;
  document.getElementById('navName').textContent = g.name.toUpperCase();
  document.getElementById('navTagline').textContent = g.tagline.toUpperCase();

  const hero = document.getElementById('heroSection');
  hero.style.background = `linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)), url('${g.hero_bg}') center/cover no-repeat`;
  document.getElementById('heroTitle').innerHTML = g.name + '<br><em>Store</em>';
  document.getElementById('heroDesc').textContent = g.description;
  const metaEl = document.getElementById('heroMeta');
  g.meta.forEach((m, i) => {
    metaEl.insertAdjacentHTML('beforeend',
      `<span>${m}</span>${i < g.meta.length-1 ? '<span style="opacity:.3">·</span>' : ''}`);
  });

  document.getElementById('footerLinks').innerHTML =
    `<a href="${g.web}" target="_blank">${g.web.replace('https://','')}</a>
     &nbsp;·&nbsp;
     <a href="https://instagram.com/${g.instagram}" target="_blank">@${g.instagram}</a>
     <br><br>
     <a href="mailto:contacto@brandingcorp.es">CONTACTO</a>
     &nbsp;·&nbsp;
     <a href="/legal/condiciones-venta.html" target="_blank">ENVÍOS Y DEVOLUCIONES</a>
     &nbsp;·&nbsp;
     <a href="/legal/privacidad.html" target="_blank">PRIVACIDAD</a>
     &nbsp;·&nbsp;
     <a href="/legal/aviso-legal.html" target="_blank">AVISO LEGAL</a>`;

  const cats = ['all', ...new Set(C.products.map(p => p.category))];
  const catLabels = { all:'TODO', ropa:'ROPA', accesorios:'ACCESORIOS', equipamiento:'EQUIPAMIENTO' };
  const filtersEl = document.getElementById('filtersContainer');
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat==='all' ? ' active' : '');
    btn.textContent = catLabels[cat] || cat.toUpperCase();
    btn.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(C.products, cat);
    };
    filtersEl.appendChild(btn);
  });

  window._products = C.products;
  renderProducts(C.products, 'all');
}

function renderProducts(products, filter) {
  const grid = document.getElementById('productsGrid');
  const list = filter === 'all' ? products : products.filter(p => p.category === filter);
  grid.innerHTML = list.map(p => {
    const hasSizes = p.sizes && p.sizes.length > 1;
    const imgs = productImages(p);
    const imgHtml = imgs.length
      ? `<img src="${imgs[0]}" alt="${p.name}" loading="lazy" class="loaded">
         ${imgs.length > 1 ? `<span class="photo-count">1/${imgs.length}</span>` : ''}`
      : `<div class="ph-inner">
           <span style="font-size:52px;line-height:1;">${p.emoji}</span>
           <span class="lbl">FOTO PRÓXIMAMENTE</span>
         </div>`;

    return `
    <div class="product-card" id="card-${p.id}">
      <div class="product-img${imgs.length ? ' has-photo' : ''}"${imgs.length ? ` onclick="openLightbox('${p.id}')"` : ''}>
        ${imgHtml}
        ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        ${hasSizes ? `
        <div class="size-selector" id="sz-${p.id}">
          ${p.sizes.map((s,i) => `<button class="size-opt${i===0?' selected':''}" onclick="selectSz('${p.id}','${s}',this)">${s}</button>`).join('')}
        </div>` : `<div id="sz-${p.id}" data-selected="${p.sizes ? p.sizes[0] : 'ÚNICA'}" style="display:none;"></div>`}
        <div class="product-footer">
          <div class="product-price">${p.price.toFixed(2).replace('.',',')} <small>€</small></div>
          <button class="add-btn" id="addbtn-${p.id}" onclick="addToCart('${p.id}')">+ AÑADIR</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function productImages(p) {
  return p.images || (p.image_url ? [p.image_url] : []);
}

// ── Galería ampliada ────────────────────────────────────────
let lb = { imgs: [], i: 0 };

function openLightbox(productId) {
  const p = window._products.find(x => x.id === productId);
  lb = { imgs: productImages(p), i: 0 };
  document.getElementById('lbTitle').textContent = p.name;
  document.getElementById('lbImg').alt = p.name;
  const multi = lb.imgs.length > 1;
  document.getElementById('lbPrev').style.display = multi ? '' : 'none';
  document.getElementById('lbNext').style.display = multi ? '' : 'none';
  document.getElementById('lbDots').innerHTML = multi
    ? lb.imgs.map((_, i) => `<button class="lb-dot" onclick="lbGo(${i})" aria-label="Foto ${i+1}"></button>`).join('')
    : '';
  lbGo(0);
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function lbGo(i) {
  lb.i = (i + lb.imgs.length) % lb.imgs.length;
  document.getElementById('lbImg').src = lb.imgs[lb.i];
  document.querySelectorAll('.lb-dot').forEach((d, j) => d.classList.toggle('active', j === lb.i));
}

function lbStep(d) { lbGo(lb.i + d); }

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbStep(-1);
  if (e.key === 'ArrowRight') lbStep(1);
});

// Deslizar con el dedo en el móvil
let lbTouchX = null;
document.addEventListener('touchstart', e => {
  if (e.target.id === 'lbImg') lbTouchX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (lbTouchX === null) return;
  const dx = e.changedTouches[0].clientX - lbTouchX;
  lbTouchX = null;
  if (Math.abs(dx) > 40 && lb.imgs.length > 1) lbStep(dx < 0 ? 1 : -1);
});

function selectSz(id, size, btn) {
  const el = document.getElementById('sz-' + id);
  el.dataset.selected = size;
  el.querySelectorAll('.size-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Reset add button if size changes
  const addBtn = document.getElementById('addbtn-' + id);
  if (addBtn) { addBtn.classList.remove('added'); addBtn.textContent = '+ AÑADIR'; }
}

function addToCart(productId) {
  const product = window._products.find(p => p.id === productId);
  if (!product) return;

  const szEl = document.getElementById('sz-' + productId);
  const size = szEl ? (szEl.dataset.selected || 'ÚNICA') : 'ÚNICA';

  const key = productId + '::' + size;
  const existing = cart.find(i => i.key === key);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ key, id: productId, name: product.name, price: product.price, size, emoji: product.emoji, qty: 1 });
  }

  saveCart();
  renderCart();

  // Feedback visual en el botón
  const btn = document.getElementById('addbtn-' + productId);
  if (btn) {
    btn.classList.add('added');
    btn.textContent = '✓ AÑADIDO';
    setTimeout(() => { btn.classList.remove('added'); btn.textContent = '+ AÑADIR'; }, 1400);
  }

  // Toast discreto
  showToast('✓ ' + product.name + ' añadido');
}

function removeFromCart(key) {
  cart = cart.filter(i => i.key !== key);
  saveCart();
  renderCart();
}

function changeQty(key, delta) {
  const item = cart.find(i => i.key === key);
  if (!item) return;
  item.qty = Math.max(0, item.qty + delta);
  if (item.qty === 0) cart = cart.filter(i => i.key !== key);
  saveCart();
  renderCart();
}

function saveCart() {
  localStorage.setItem('bc_cart_' + gymId, JSON.stringify(cart));
}

function renderCart() {
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);

  // Badge
  const badge = document.getElementById('cartBadge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';

  // Items
  const itemsEl = document.getElementById('cartItems');
  const emptyEl = document.getElementById('cartEmpty');
  const footEl = document.getElementById('cartFoot');

  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="cart-empty">El carrito está vacío</div>';
    footEl.style.display = 'none';
    return;
  }

  footEl.style.display = 'block';
  document.getElementById('cartTotal').textContent = total.toFixed(2).replace('.', ',') + ' €';

  itemsEl.innerHTML = cart.map(item => {
    const p = (window._products || []).find(x => x.id === item.id);
    const thumb = p && productImages(p)[0];
    return `
    <div class="cart-item">
      ${thumb ? `<img class="cart-item-thumb" src="${thumb}" alt="">` : `<div class="cart-item-emoji">${item.emoji}</div>`}
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        ${item.size && item.size !== 'ÚNICA' ? `<div class="cart-item-size">TALLA: ${item.size}</div>` : ''}
        <div class="cart-item-price">${(item.price * item.qty).toFixed(2).replace('.', ',')} €</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty('${item.key}', -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty('${item.key}', 1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function openCart() {
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('cartOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeCart() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function toggleCart() {
  const drawer = document.getElementById('cartDrawer');
  if (drawer.classList.contains('open')) closeCart();
  else openCart();
}

async function checkout() {
  if (cart.length === 0) return;

  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.textContent = 'PROCESANDO...';

  const origin = window.location.origin + window.location.pathname.replace(/\/$/, '');

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        // El precio lo pone el servidor a partir del id; name/price solo se mantienen por compatibilidad
        items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, size: i.size, qty: i.qty })),
        gym_id: gymId,
        success_url: origin + '/?pedido=ok',
        cancel_url: origin + '/',
      }),
    });

    const data = await res.json();

    if (data.url) {
      localStorage.removeItem('bc_cart_' + gymId);
      window.location.href = data.url;
    } else {
      alert('Error al procesar el pedido: ' + (data.error || 'Error desconocido'));
      btn.disabled = false;
      btn.textContent = 'FINALIZAR PEDIDO →';
    }
  } catch (err) {
    alert('Error de conexión. Por favor, inténtalo de nuevo.');
    btn.disabled = false;
    btn.textContent = 'FINALIZAR PEDIDO →';
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

init();
</script>
