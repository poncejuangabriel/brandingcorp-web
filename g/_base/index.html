<!DOCTYPE html>
<html lang="es">
<head>

<title>Tienda</title>
<script>

  window.GYM_CONFIG_PATH = 'config.json';
</script>
</head>
<body style="margin:0;background:#000;">
<script>
  // Cargar la plantilla HTML base y reemplazar este documento
  fetch('../_base/tienda.html')

      document.open();
      document.write(html);
      document.close();
    });
</script>
