<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <style>
    .lt { font-family: 'Montserrat', 'Helvetica Neue', sans-serif; font-weight: 500; letter-spacing: 2px; fill: #ffffff; }
    .lb { font-weight: 800; }
  </style>

  <!-- Monograma BC -->
  <g transform="translate(10,10)">
    <!-- Marco exterior -->
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#ffffff" stroke-width="10"/>

    <!-- B: barra vertical + dos bumps curvos (compactos para dejar espacio a la C) -->
    <path d="M 20,20 L 20,80
             M 20,20 L 42,20 C 52,20 57,26 57,34 C 57,42 52,46 42,46 L 20,46
             M 20,54 L 44,54 C 55,54 60,60 60,68 C 60,76 54,80 44,80 L 20,80"
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="square"/>

    <!-- C: posicionada a la derecha de la B -->
    <path d="M 88,22 L 68,22 L 68,78 L 88,78"
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="square"/>
  </g>

  <!-- Texto BRANDING CORP -->
  <text x="145" y="74" font-size="36" class="lt"><tspan class="lb">BRANDING</tspan> CORP</text>
</svg>
